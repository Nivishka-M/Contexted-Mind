[package]
name = "contexted-mind"
version = "0.1.0"
description = "Always-on-top orb that keeps your current task and context tree one hover away"
authors = ["Nivishka Abhith"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"
xcap = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

# The same GTK that Tauri uses, to give the orb window an X11 input shape.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
